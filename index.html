<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栞音 (Shiori-ne) x Emo-Re Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Emo-Re Design System */
            --bg-color: #FDFBF7; /* Off-white / Cream */
            --card-bg: #ffffff;
            --primary-color: #E07A5F; /* Warm Orange / Terracotta */
            --accent-color: #F2CC8F; /* Soft Yellow */
            --text-color: #3D405B; /* Dark Charcoal */
            --text-muted: #81B29A; /* Sage Green */
            --border-radius: 16px;
            --shadow: 0 10px 30px rgba(224, 122, 95, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(#E07A5F22 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.4rem;
            color: var(--primary-color);
            letter-spacing: 0.2em;
            margin-bottom: 8px;
            font-family: 'Sawarabi Mincho', serif;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 35px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            border: 1px solid rgba(224, 122, 95, 0.1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        /* API Key Section */
        .settings-panel {
            margin-bottom: 20px;
            padding: 15px 20px;
            background: #F4F1DE;
            border-radius: 12px;
            font-size: 0.85rem;
            border: 1px dashed var(--primary-color);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary-color);
        }

        .settings-content {
            margin-top: 10px;
            display: none;
        }

        .settings-content.active {
            display: block;
        }

        .api-input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: sans-serif;
            outline: none;
            background: #fff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            font-size: 1rem;
            color: var(--primary-color);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .btn-primary {
            flex: 2;
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 15px rgba(224, 122, 95, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(224, 122, 95, 0.4);
            background-color: #d16a50;
        }

        .btn-primary:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-outline {
            flex: 1;
            background-color: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
        }

        #summary-area {
            display: none;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .summary-title {
            font-size: 1.6rem;
            margin-bottom: 25px;
            color: var(--primary-color);
            text-align: center;
            font-family: 'Sawarabi Mincho', serif;
        }

        .points-list {
            list-style: none;
            margin-bottom: 30px;
        }

        .points-list li {
            position: relative;
            padding-left: 35px;
            margin-bottom: 18px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .points-list li::before {
            content: "✿";
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .detailed-summary {
            font-size: 1rem;
            color: var(--text-color);
            text-align: justify;
            background: #FDFBF7;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--accent-color);
            white-space: pre-wrap;
            position: relative;
        }

        .detailed-summary::after {
            content: '"';
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 4rem;
            color: var(--accent-color);
            opacity: 0.3;
            font-family: serif;
        }

        .audio-controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .loading {
            text-align: center;
            display: none;
            padding: 30px;
        }

        .loading-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 50px;
            padding-bottom: 30px;
            letter-spacing: 0.1em;
        }

        /* Vintage Filter Effect for Summary Area */
        .vintage-effect {
            position: relative;
        }
        
        .vintage-effect::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(224, 122, 95, 0.03);
            pointer-events: none;
            border-radius: var(--border-radius);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>栞音 - Shiori-ne</h1>
        <p class="subtitle">〜 Emo-Re Edition: 記憶に刻む読書体験 〜</p>
    </header>

    <!-- API Key Settings -->
    <div class="settings-panel">
        <div class="settings-header" id="settings-toggle">
            <span>⚙️ Gemini APIキー設定</span>
            <span id="toggle-icon">▼</span>
        </div>
        <div class="settings-content" id="settings-content">
            <p style="margin-bottom: 8px; font-size: 0.8rem;">Google Gemini APIキーを入力してください</p>
            <div class="api-input-group">
                <input type="password" id="api-key-input" placeholder="AIza..." autocomplete="off">
                <button id="save-key-btn" class="btn-primary btn-sm">保存</button>
            </div>
            <p id="key-status" style="margin-top: 5px; font-size: 0.75rem; color: var(--text-muted); display: none;">✓ 鍵を預かりました</p>
        </div>
    </div>

    <div class="card">
        <div class="input-group">
            <label for="book-title">心に残したい本の名前</label>
            <input type="text" id="book-title" placeholder="例：星の王子さま" autocomplete="off">
            <div class="button-group">
                <button id="summary-btn" class="btn-primary">
                    <span>物語を紐解く</span>
                </button>
            </div>
        </div>
    </div>

    <div id="loading-area" class="loading">
        <div class="loading-icon">⏳</div>
        <p>記憶の断片を集めています...</p>
    </div>

    <div id="summary-area" class="card vintage-effect">
        <h2 id="display-title" class="summary-title">本の記憶</h2>
        
        <ul id="points-list" class="points-list">
            <!-- Points will be inserted here -->
        </ul>

        <div id="detailed-text" class="detailed-summary">
            <!-- Detailed summary will be inserted here -->
        </div>

        <div class="audio-controls">
            <button id="play-btn" class="btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                声を聴く
            </button>
            <button id="stop-btn" class="btn-outline">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12"></rect></svg>
                静寂
            </button>
        </div>
    </div>

    <footer>
        &copy; 2026 栞音 x Emo-Re Project<br>
        "Preserving memories through the essence of books."
    </footer>
</div>

<script>
    // DOM Elements
    const apiKeyInput = document.getElementById('api-key-input');
    const saveKeyBtn = document.getElementById('save-key-btn');
    const keyStatus = document.getElementById('key-status');
    const settingsToggle = document.getElementById('settings-toggle');
    const settingsContent = document.getElementById('settings-content');
    const toggleIcon = document.getElementById('toggle-icon');

    const bookTitleInput = document.getElementById('book-title');
    const summaryBtn = document.getElementById('summary-btn');
    const loadingArea = document.getElementById('loading-area');
    const summaryArea = document.getElementById('summary-area');
    const displayTitle = document.getElementById('display-title');
    const pointsList = document.getElementById('points-list');
    const detailedText = document.getElementById('detailed-text');
    const playBtn = document.getElementById('play-btn');
    const stopBtn = document.getElementById('stop-btn');

    // Speech Synthesis Setup
    let speech = new SpeechSynthesisUtterance();
    speech.lang = 'ja-JP';
    speech.rate = 0.9; // Slightly slower for nostalgic feel
    speech.pitch = 1.0;

    // Load API Key from LocalStorage
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
            keyStatus.style.display = 'block';
        } else {
            settingsContent.classList.add('active');
            toggleIcon.textContent = '▲';
        }
    });

    // Toggle Settings
    settingsToggle.addEventListener('click', () => {
        settingsContent.classList.toggle('active');
        toggleIcon.textContent = settingsContent.classList.contains('active') ? '▲' : '▼';
    });

    // Save API Key
    saveKeyBtn.addEventListener('click', () => {
        const key = apiKeyInput.value.trim();
        if (key) {
            localStorage.setItem('gemini_api_key', key);
            keyStatus.style.display = 'block';
            setTimeout(() => {
                settingsContent.classList.remove('active');
                toggleIcon.textContent = '▼';
            }, 1000);
        } else {
            alert('鍵を入力してください。');
        }
    });

    // Gemini AI Summary Logic
    async function fetchSummary(bookTitle) {
        const API_KEY = localStorage.getItem('gemini_api_key');
        if (!API_KEY) throw new Error('APIキーが設定されていません。');

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `あなたはプロのブックレビュアーです。指定された本の「核心となる3つのポイント（箇条書き）」と「魅力的なあらすじ（300文字程度）」を、日本語の「です・ます」調で教えてください。ノスタルジックで温かい、情緒的な表現を心がけてください。\n\n書名: ${bookTitle}`
                        }]
                    }]
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'APIリクエストに失敗しました');
            }

            const data = await response.json();
            if (!data.candidates || data.candidates.length === 0) throw new Error('AIからの応答が空でした。');

            const contentText = data.candidates[0].content.parts[0].text;
            return parseResponse(contentText);
        } catch (error) {
            console.error('Error:', error);
            throw error;
        }
    }

    function parseResponse(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const points = [];
        let description = "";

        lines.forEach(line => {
            if ((line.startsWith('・') || line.startsWith('-') || /^\d+\./.test(line)) && points.length < 3) {
                points.push(line.replace(/^[・\-\d\.]+\s*/, ''));
            } else if (!line.includes('ポイント') && !line.includes('あらすじ')) {
                description += line + "\n";
            }
        });

        while (points.length < 3) points.push("物語の続きは、あなたの心の中に。");

        return {
            points: points,
            description: description.trim() || text
        };
    }

    function showSummary(title, data) {
        loadingArea.style.display = 'none';
        summaryArea.style.display = 'block';
        
        displayTitle.textContent = `『${title}』の記憶`;
        
        pointsList.innerHTML = '';
        data.points.forEach(point => {
            const li = document.createElement('li');
            li.textContent = point;
            pointsList.appendChild(li);
        });

        detailedText.textContent = data.description;

        const speechText = `${title}の記憶を紐解きます。大切な3つのこと。1つ目、${data.points[0]} 2つ目、${data.points[1]} 3つ目、${data.points[2]} 物語のあらすじです。${data.description}`;
        speech.text = speechText;
    }

    summaryBtn.addEventListener('click', async () => {
        const title = bookTitleInput.value.trim();
        if (!localStorage.getItem('gemini_api_key')) {
            alert('Gemini APIキーを設定してください。');
            settingsContent.classList.add('active');
            return;
        }
        if (!title) {
            alert('本の名前を教えてください。');
            return;
        }

        summaryArea.style.display = 'none';
        loadingArea.style.display = 'block';
        summaryBtn.disabled = true;
        window.speechSynthesis.cancel();

        try {
            const result = await fetchSummary(title);
            showSummary(title, result);
        } catch (error) {
            alert('エラーが発生しました: ' + error.message);
            loadingArea.style.display = 'none';
        } finally {
            summaryBtn.disabled = false;
        }
    });

    playBtn.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(speech);
    });

    stopBtn.addEventListener('click', () => {
        window.speechSynthesis.cancel();
    });

    window.speechSynthesis.onvoiceschanged = () => {
        const voices = window.speechSynthesis.getVoices();
        const japaneseVoice = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP');
        if (japaneseVoice) speech.voice = japaneseVoice;
    };
</script>

</body>
</html>
